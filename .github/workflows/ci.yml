name: CI

on:
  push:
    branches: [main]
  pull_request:

# Continuous Integration only — no deploy. The stack runs locally (see
# docs/tickets/EPIC-09-ci-docs.md). The pipeline runs in order; any failing
# stage fails the run: lint → typecheck → unit → integration → docker build → E2E.

jobs:
  verify:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: Integration (Testcontainers — real Postgres + Redis)
    runs-on: ubuntu-latest
    needs: verify
    # The integration suites boot their own throwaway PostgreSQL + Redis via
    # Testcontainers and run the migrations in a Jest global setup (TICKET-08.1),
    # so the runner only needs Docker, which ubuntu-latest provides.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @jobflow/database generate
      - name: API integration tests (with coverage)
        run: pnpm --filter @jobflow/api test:integration -- --coverage --coverageDirectory=coverage
      - name: Worker integration tests (with coverage)
        run: pnpm --filter @jobflow/worker test:integration -- --coverage --coverageDirectory=coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: |
            apps/api/coverage
            apps/worker/coverage
          if-no-files-found: ignore

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose -f infra/docker-compose.yml build

  e2e:
    name: Playwright E2E (Docker Compose stack)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up --build -d
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then echo "api up"; exit 0; fi
            sleep 3
          done
          echo "API did not become healthy" && docker compose -f infra/docker-compose.yml logs && exit 1
      - name: Install Playwright browsers
        run: pnpm --filter @jobflow/web exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm --filter @jobflow/web test:e2e
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
