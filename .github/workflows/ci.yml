name: CI

on:
  push:
    branches: [main]
  pull_request:

# Continuous Integration only — no deploy. The stack runs locally (see
# docs/tickets/EPIC-09-ci-docs.md). Later tickets extend this with
# integration, docker build and E2E stages.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit
