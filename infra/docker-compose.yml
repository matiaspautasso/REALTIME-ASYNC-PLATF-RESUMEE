# JobFlow local stack. For the MVP everything runs locally (see docs/adr).
#
# Today this brings up the infrastructure every app needs: PostgreSQL and
# Redis, plus the shared upload volume. The api / worker / web service blocks
# are wired in TICKET-09.2 once their Dockerfiles exist; the commented block
# below is the intended shape (note: api and worker mount the SAME upload
# volume — ADR-0003).

name: jobflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobflow}
      POSTGRES_DB: ${POSTGRES_DB:-jobflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Wired in TICKET-09.2 (Dockerfiles) ---------------------------------
  # api:
  #   build: { context: .., dockerfile: apps/api/Dockerfile }
  #   env_file: ../.env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   ports: ["${API_PORT:-3000}:3000"]
  #   volumes: [uploads:/data/uploads]
  #
  # worker:
  #   build: { context: .., dockerfile: apps/worker/Dockerfile }
  #   env_file: ../.env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   volumes: [uploads:/data/uploads]   # SAME volume as api (ADR-0003)
  #
  # web:
  #   build: { context: .., dockerfile: apps/web/Dockerfile }
  #   depends_on: [api]
  #   ports: ["${WEB_PORT:-5173}:5173"]

volumes:
  postgres-data:
  uploads:
